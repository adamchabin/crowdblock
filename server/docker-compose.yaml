services:
  postgres:
    image: postgres:16
    container_name: pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: crowdblock
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The latest build of the dev branch. Update: docker compose pull && docker compose up -d
  # For `go run` (run.sh) start only the databases: docker compose up -d postgres redis
  server:
    image: ghcr.io/adamchabin/crowdblock-server:dev-latest
    container_name: crowdblock-server
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/crowdblock?sslmode=disable
      REDIS_ADDR: redis:6379
      SEED_DEV_DATA: "1"   # test users and keys, sample reports (seed.sql)
      DEBUG: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
