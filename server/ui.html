<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>crowdblock</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --card: #fff;
        --fg: #1a1d21;
        --mute: #6b7280;
        --bar: #3b82f6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111418;
          --card: #1b1f25;
          --fg: #e6e8eb;
          --mute: #8b93a0;
          --bar: #60a5fa;
        }
      }
      body {
        margin: 0;
        font:
          15px system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
        min-height: 100vh;
      }
      main { max-width:1600px; margin:0 auto; padding:24px 16px; width:100%; }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      .mute {
        color: var(--mute);
        font-size: 13px;
      }
      .grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        margin: 20px 0;
      }
      .card {
        background: var(--card);
        border-radius: 10px;
        padding: 14px 16px;
      }
      .card b {
        display: block;
        font-size: 26px;
        margin-top: 4px;
      }
      h2 {
        font-size: 14px;
        margin: 0 0 10px;
        color: var(--mute);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .row {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      }
      .chart {
        display: flex;
        align-items: flex-end;
        gap: 3px;
        height: 120px;
      }
      .chart i {
        flex: 1;
        background: var(--bar);
        border-radius: 2px 2px 0 0;
        min-height: 1px;
      }
      .axis {
        display: flex;
        justify-content: space-between;
        margin-top: 4px;
      }
      .bar {
        display: grid;
        grid-template-columns: 120px 1fr 56px;
        gap: 8px;
        align-items: center;
        margin: 5px 0;
      }
      .bar span:nth-child(3) {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .bar div {
        background: var(--bar);
        height: 10px;
        border-radius: 3px;
      }
      #err {
        color: #dc2626;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }
      button {
        font: inherit;
        padding: 7px 14px;
        border: 0;
        border-radius: 8px;
        background: var(--bar);
        color: #fff;
        cursor: pointer;
      }
      button.plain {
        background: transparent;
        color: var(--mute);
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      dialog {
        border: 0;
        border-radius: 12px;
        padding: 20px;
        background: var(--card);
        color: var(--fg);
        width: min(360px, 92vw);
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.45);
      }
      dialog h2 {
        margin-top: 0;
      }
      dialog input {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        padding: 8px;
        margin: 8px 0 4px;
      }
      dialog menu {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding: 0;
        margin: 14px 0 0;
      }
      #msg {
        min-height: 1.3em;
        font-size: 13px;
      }
      #msg.bad {
        color: #dc2626;
      }
      #map {
        position: relative;
        overflow: hidden;
        background-image:
          linear-gradient(90deg, #6b728033 1px, transparent 1px),
          linear-gradient(#6b728033 1px, transparent 1px);
        background-size:
          10% 100%,
          100% 20%;
        border-radius: 8px;
      }
      #map svg {
        display: block;
        width: 100%;
        height: auto;
      }
      #maptoggle {
        padding: 0 6px;
        font-size: 12px;
        text-transform: none;
        letter-spacing: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>crowdblock</h1>
          <div class="mute">
            Crowd-sourced blocklist &middot; <span id="when">loading…</span>
            <span id="err"></span>
          </div>
        </div>
        <button id="reg">Register</button>
      </header>
      <dialog id="dlg">
        <form id="form" method="dialog">
          <h2>Register</h2>
          <div class="mute">We'll e-mail you a generated password.</div>
          <input
            id="email"
            type="email"
            required
            maxlength="254"
            autocomplete="email"
            placeholder="you@example.com"
          />
          <div id="msg"></div>
          <menu>
            <button type="button" class="plain" id="cancel">Close</button
            ><button id="send">Send password</button>
          </menu>
        </form>
      </dialog>
      <div class="grid" id="cards"></div>
      <div class="card">
        <h2>Reports per hour, last 24 h</h2>
        <div class="chart" id="hourly"></div>
        <div class="axis mute"><span>24 h ago</span><span>now</span></div>
      </div>
      <div class="card" style="margin-top: 12px">
        <h2>
          World map (reported IPs, 24 h)
          <button type="button" class="plain" id="maptoggle">hide</button>
        </h2>
        <div id="map"></div>
      </div>
      <h2 style="margin: 22px 0 0">
        Cache
        <span
          class="mute"
          id="cache-since"
          style="text-transform: none; letter-spacing: 0; font-weight: 400"
        ></span>
      </h2>
      <div class="grid" id="cache-cards"></div>
      <div class="row">
        <div class="card">
          <h2>GET /ips answered by</h2>
          <div id="lists"></div>
        </div>
        <div class="card">
          <h2>API key lookups</h2>
          <div id="keys"></div>
        </div>
      </div>
      <div class="row" style="margin-top: 12px">
        <div class="card">
          <h2>Top countries (reported IPs, 24 h)</h2>
          <div id="countries"></div>
        </div>
        <div class="card">
          <h2>Reports by source (24 h)</h2>
          <div id="sources"></div>
        </div>
      </div>
    </main>
    <script>
      // textContent only: no value from the API is ever parsed as HTML.
      const $ = (id) => document.getElementById(id);
      const el = (tag, text, cls) => {
        const e = document.createElement(tag);
        if (text !== undefined) e.textContent = text;
        if (cls) e.className = cls;
        return e;
      };
      const fmt = (n) => n.toLocaleString();

      function bars(box, rows) {
        box.replaceChildren();
        const max = Math.max(1, ...rows.map((r) => r[1]));
        if (!rows.length) box.append(el("div", "no data yet", "mute"));
        for (const [name, n] of rows) {
          const bar = el("div", undefined, "bar"),
            fill = el("div");
          fill.style.width = (100 * n) / max + "%";
          const track = el("span");
          track.append(fill);
          bar.append(el("span", name), track, el("span", fmt(n)));
          box.append(bar);
        }
      }

      let worldCache = null;
      async function world() {
        if (!worldCache) {
          const r = await fetch("/api/v1/world");
          if (!r.ok) throw new Error("HTTP " + r.status);
          worldCache = await r.json();
        }
        return worldCache;
      }
      // Choropleth of reported IPs over simplified country shapes;
      // countries without shapes stay visible in the Top countries bars.
      function drawMap(box, geo, countries) {
        box.replaceChildren();
        const byIso = {};
        let max = 1;
        for (const c of countries) {
          byIso[c.country] = c;
          if (c.ips > max) max = c.ips;
        }
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("viewBox", "0 6 360 144");
        for (const f of geo.features) {
          const iso = f.properties && f.properties.iso2;
          const hit = iso && byIso[iso];
          for (const poly of f.geometry.coordinates) {
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute(
              "d",
              poly
                .map((ring) =>
                  ring
                    .map(
                      (p, i) =>
                        (i ? "L" : "M") + (p[0] + 180).toFixed(1) + " " + (90 - p[1]).toFixed(1),
                    )
                    .join(""),
                )
                .join("") + "Z",
            );
            path.setAttribute("fill", hit ? "var(--bar)" : "currentColor");
            path.setAttribute(
              "fill-opacity",
              hit ? (0.35 + 0.65 * Math.sqrt(hit.ips / max)).toFixed(2) : "0.08",
            );
            path.setAttribute("stroke", "var(--bg)");
            path.setAttribute("stroke-width", "0.4");
            if (hit) {
              const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
              title.textContent = `${hit.country_name || iso}: ${fmt(hit.ips)}`;
              path.append(title);
            }
            svg.append(path);
          }
        }
        box.append(svg);
      }

      async function load() {
        try {
          const r = await fetch("/api/v1/stats");
          if (!r.ok) throw new Error("HTTP " + r.status);
          const s = await r.json();
          $("err").textContent = "";
          $("when").textContent =
            "updated " + new Date(s.generated_at).toLocaleTimeString();

          $("cards").replaceChildren(
            ...[
              ["Reports, 24 h", s.reports_24h],
              ["Reports, 7 d", s.reports_7d],
              ["Unique IPs, 24 h", s.unique_ips_24h],
              ["Blacklisted, 24 h", s.blacklisted_24h],
              ["Contributors", s.users],
              ["Active API keys", s.active_keys],
            ].map(([label, n]) => {
              const c = el("div", undefined, "card");
              c.append(el("span", label, "mute"), el("b", fmt(n)));
              return c;
            }),
          );

          const max = Math.max(1, ...s.hourly);
          $("hourly").replaceChildren(
            ...s.hourly.map((n, i) => {
              const b = el("i");
              b.style.height = (100 * n) / max + "%";
              b.title = `${24 - i - 1} h ago: ${fmt(n)}`;
              return b;
            }),
          );
          const c = s.cache,
            pct = (hit, miss) =>
              hit + miss ? ((100 * hit) / (hit + miss)).toFixed(1) + "%" : "–";
          const listHits = c.lists.full + c.lists.not_modified + c.lists.delta;
          $("cache-since").textContent =
            "· counted since " + new Date(c.since).toLocaleString();
          const cards = [
            ["API key cache hit rate", pct(c.api_key.hits, c.api_key.misses)],
            ["List cache hit rate", pct(listHits, c.lists.misses)],
          ];
          if (c.redis)
            cards.push(
              ["Redis keys", fmt(c.redis.keys)],
              [
                "Redis memory",
                (c.redis.used_memory / 1048576).toFixed(1) + " MiB",
              ],
              [
                "Redis hit rate",
                pct(c.redis.keyspace_hits, c.redis.keyspace_misses),
              ],
            );
          $("cache-cards").replaceChildren(
            ...cards.map(([label, v]) => {
              const d = el("div", undefined, "card");
              d.append(el("span", label, "mute"), el("b", v));
              return d;
            }),
          );
          bars($("lists"), [
            ["full list", c.lists.full],
            ["304 not modified", c.lists.not_modified],
            ["delta", c.lists.delta],
            ["from postgres", c.lists.misses],
          ]);
          bars($("keys"), [
            ["from Redis", c.api_key.hits],
            ["from postgres", c.api_key.misses],
          ]);
          bars(
            $("countries"),
            s.countries.map((c) => [c.country_name || c.country, c.ips]),
          );
          world()
            .then((geo) => drawMap($("map"), geo, s.countries))
            .catch(() => {
              $("map").replaceChildren(el("div", "map unavailable", "mute"));
            });
          bars(
            $("sources"),
            Object.entries(s.sources).sort((a, b) => b[1] - a[1]),
          );
        } catch (e) {
          $("err").textContent = " · cannot load stats: " + e.message;
        }
      }
      $("maptoggle").onclick = () => {
        const hidden = $("map").toggleAttribute("hidden");
        $("maptoggle").textContent = hidden ? "show" : "hide";
      };
      $("reg").onclick = () => {
        $("msg").textContent = "";
        $("msg").className = "";
        $("dlg").showModal();
        $("email").focus();
      };
      $("cancel").onclick = () => $("dlg").close();
      $("form").onsubmit = async (ev) => {
        ev.preventDefault();
        const msg = $("msg"),
          send = $("send");
        send.disabled = true;
        msg.className = "";
        msg.textContent = "Sending…";
        try {
          const r = await fetch("/api/v1/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: $("email").value.trim() }),
          });
          if (r.status === 202) {
            msg.textContent = "Check your inbox: the password is on its way.";
            $("email").value = "";
          } else {
            msg.className = "bad";
            msg.textContent = (await r.text()).trim() || "HTTP " + r.status;
          }
        } catch (e) {
          msg.className = "bad";
          msg.textContent = "Network error: " + e.message;
        }
        send.disabled = false;
      };

      load();
      setInterval(load, 60000);
    </script>
  </body>
</html>
