# Server image: tests and a build on every change of the server, and on a
# version tag (v1.2.3) a release:
#   - image ghcr.io/<owner>/crowdblock-server:{1.2.3, 1.2, latest} (amd64, arm64)
#   - GitHub Release with generated notes
name: server

on:
  push:
    branches: [main, dev]
    tags: ['v*']
    paths:
      - 'server/**'
      - 'go.mod'
      - 'go.sum'
      - '.dockerignore'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'go.mod'
      - 'go.sum'
      - '.dockerignore'
      - '.github/workflows/server.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/crowdblock-server

jobs:
  test:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04 on 2026-10-19
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go vet ./...
      - run: go test ./...

  image:
    needs: test
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04 on 2026-10-19
    permissions:
      contents: write   # GitHub Release
      packages: write   # ghcr.io
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.RELEASE == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          flavor: |
            latest=${{ env.RELEASE == 'true' && !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.RELEASE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: softprops/action-gh-release@v3
        if: env.RELEASE == 'true'
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Server image

            ```sh
            docker pull ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ```

            Platforms: `linux/amd64`, `linux/arm64`. Configuration: see
            [server/README.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/server/README.md).
