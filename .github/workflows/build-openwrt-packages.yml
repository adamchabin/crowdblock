name: Build OpenWrt Packages

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'crowdblock/**'
      - 'luci-app-crowdblock/**'
      - 'build-crowdblock.sh'
      - 'build-luci-app-crowdblock.sh'
      - '.github/workflows/build-openwrt-packages.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'crowdblock/**'
      - 'luci-app-crowdblock/**'
      - 'build-crowdblock.sh'
      - 'build-luci-app-crowdblock.sh'
      - '.github/workflows/build-openwrt-packages.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # OpenWrt SDK version and target
      OPENWRT_VERSION: 25.12.5
      OPENWRT_TARGET: 'mediatek/filogic'
      OPENWRT_GCC_VERSION: 14.3.0
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget tar xz-utils gcc g++ make ncurses-dev libssl-dev rsync
        
    - name: Cache OpenWrt SDK
      uses: actions/cache@v4
      with:
        path: openwrt-sdk-*
        key: ${{ runner.os }}-openwrt-sdk-${{ env.OPENWRT_VERSION }}-${{ env.OPENWRT_TARGET }}-gcc${{ env.OPENWRT_GCC_VERSION }}
        restore-keys: |
          ${{ runner.os }}-openwrt-sdk-
          
    - name: Download OpenWrt SDK
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        SDK_FILENAME="openwrt-sdk-${{ env.OPENWRT_VERSION }}-${{ env.OPENWRT_TARGET }}_gcc-${{ env.OPENWRT_GCC_VERSION }}_musl.Linux-x86_64.tar.zst"
        SDK_URL="https://downloads.openwrt.org/releases/${{ env.OPENWRT_VERSION }}/targets/${{ env.OPENWRT_TARGET }}/${SDK_FILENAME}"
        
        echo "Downloading OpenWrt SDK from $SDK_URL"
        wget --quiet "$SDK_URL" -O sdk.tar.zst
        
        echo "Extracting SDK..."
        tar --zstd -xvf sdk.tar.zst
        
    - name: Verify SDK
      run: |
        SDK_DIR=$(ls -d openwrt-sdk-* | head -n 1)
        echo "SDK_DIR=$SDK_DIR" >> $GITHUB_ENV
        echo "SDK_DIR: $SDK_DIR"
        ls -la "$SDK_DIR"
        test -x "$SDK_DIR/scripts/feeds"
        
    - name: Install package dependencies
      run: |
        cd "$SDK_DIR"
        # Update feeds for our package
        ./scripts/feeds update crowdblock
        # Install dependencies for our package
        ./scripts/feeds install -a -p crowdblock
        
    - name: Build crowdblock package
      run: |
        cd "$SDK_DIR"
        make package/crowdblock/compile
        find bin/packages -name "crowdblock-[0-9]*.apk" -exec realpath {} \;
        
    - name: Build luci-app-crowdblock package
      run: |
        cd "$SDK_DIR"
        make package/luci-app-crowdblock/compile
        find bin/packages -name "luci-app-crowdblock-[0-9]*.apk" -exec realpath {} \;
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-packages
        path: |
          ${{ env.SDK_DIR }}/bin/packages/**/crowdblock/*.apk
          ${{ env.SDK_DIR }}/bin/packages/**/crowdblock/luci-*/*.apk
        retention-days: 30
